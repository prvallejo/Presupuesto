 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuesto Pro v2.8 - Solirian</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel para ejecución en navegador -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2pdf -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print { .no-print { display: none !important; } }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- Utilidades ---
        const numeroALetras = (num, moneda) => {
            const Unidades = (n) => ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE'][n];
            const Decenas = (n) => {
                if (n<10) return Unidades(n);
                if (n<20) return ['DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIEZ Y SEIS','DIEZ Y SIETE','DIEZ Y OCHO','DIEZ Y NUEVE'][n-10];
                const d = Math.floor(n/10); const u = n%10;
                const t = ['','','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'][d];
                return u === 0 ? t : (d === 2 ? 'VEINTI' : t + ' Y ') + Unidades(u);
            };
            const Centenas = (n) => {
                if (n === 100) return 'CIEN';
                if (n < 100) return Decenas(n);
                const c = Math.floor(n/100); const r = n%100;
                const t = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'][c];
                return r === 0 ? t : t + ' ' + Decenas(r);
            };
            const miles = (n) => {
                if (n === 1000) return 'MIL';
                if (n < 1000) return Centenas(n);
                const m = Math.floor(n/1000); const r = n%1000;
                const t = m === 1 ? 'MIL' : Centenas(m) + ' MIL';
                return r === 0 ? t : t + ' ' + Centenas(r);
            };
            const millones = (n) => {
                if (n < 1000000) return miles(n);
                const m = Math.floor(n/1000000); const r = n%1000000;
                const t = m === 1 ? 'UN MILLÓN' : Centenas(m) + ' MILLONES';
                return r === 0 ? t : t + ' ' + miles(r);
            };
            const entero = Math.floor(num);
            const centavos = Math.round((num - entero) * 100);
            const texto = millones(entero);
            const sufijo = moneda === 'CLP' ? 'PESOS' : 'DÓLARES';
            return `SON: ${texto} ${sufijo} ${centavos > 0 ? `CON ${centavos}/100` : ''}.-`.toUpperCase();
        };

        function App() {
            const [activeModal, setActiveModal] = useState(null);
            const [selectedId, setSelectedId] = useState(null);
            const [logo, setLogo] = useState(null);
            const [config, setConfig] = useState({
                moneda: 'CLP', paridad: 950,
                decimalesCant: 2, decimalesPrecio: 0,
                decimalesSubtotal: 0, decimalesTotal: 0
            });
            const [project, setProject] = useState({ 
                obra: 'INSTALACIÓN FOTOVOLTAICA 10KW - SOLIRIAN', 
                mandante: 'SOLIRIAN SPA', 
                ubicacion: 'SANTIAGO, CHILE', 
                fecha: new Date().toISOString().split('T')[0],
                profesional: 'CONSTRUCTORA SOLIRIAN & LIBERTAD65',
                contacto: '+56 9 1234 5678 | contacto@solirian.cl | Santiago'
            });
            const [items, setItems] = useState([
                { id: '1', type: 'capitulo', nombre: 'OBRAS PREVIAS', unidad: '', cant: 0, precio: 0 },
                { id: '2', type: 'partida', nombre: 'Instalación de faenas', unidad: 'GL', cant: 1, precio: 550000 },
            ]);
            const [globalGG, setGlobalGG] = useState(15);
            const [globalUtil, setGlobalUtil] = useState(10);
            const [cubicaciones, setCubicaciones] = useState({});

            const itemsWithIndex = useMemo(() => {
                let capCount = 0; let parCount = 0;
                return items.map((item) => {
                    if (item.type === 'capitulo') {
                        capCount++; parCount = 0;
                        return { ...item, indexLabel: capCount.toString().padStart(2, '0') };
                    } else {
                        parCount++;
                        return { ...item, indexLabel: `${capCount.toString().padStart(2, '0')}.${parCount}` };
                    }
                });
            }, [items]);

            const fmt = (val, type = 'precio') => {
                let dec = config[`decimales${type.charAt(0).toUpperCase() + type.slice(1)}`] || 0;
                return Number(val || 0).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
            };

            const totales = useMemo(() => {
                let directo = 0;
                items.forEach(i => { if (i.type === 'partida') directo += Number(i.cant) * Number(i.precio); });
                const ggTotal = directo * (Number(globalGG) / 100);
                const utilTotal = directo * (Number(globalUtil) / 100);
                const neto = directo + ggTotal + utilTotal;
                const iva = neto * 0.19;
                return { directo, ggTotal, utilTotal, neto, iva, total: neto + iva };
            }, [items, globalGG, globalUtil]);

            const addItem = (index, type) => {
                const newItem = { id: Math.random().toString(36).substr(2, 9), type, 
                    nombre: type === 'capitulo' ? 'NUEVO CAPÍTULO' : 'Nueva partida de obra',
                    unidad: type === 'partida' ? 'UN' : '', cant: type === 'partida' ? 1 : 0, precio: 0 };
                const newArr = [...items]; newArr.splice(index + 1, 0, newItem); setItems(newArr);
            };

            const updateItem = (id, field, val) => {
                setItems(prev => prev.map(i => i.id === id ? { ...i, [field]: val } : i));
            };

            const handleExport = () => {
                const element = document.getElementById('presupuesto-pdf');
                const opt = { margin: 5, filename: 'Presupuesto.pdf', image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                html2pdf().from(element).set(opt).save();
            };

            return (
                <div className="min-h-screen pb-10">
                    <nav className="no-print bg-slate-900 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-xl">
                        <div className="flex items-center gap-4">
                            <button onClick={() => setActiveModal('config')} className="p-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition-colors">
                                <i data-lucide="settings" className="w-5 h-5 text-blue-400"></i>
                            </button>
                            <span className="text-[10px] font-black uppercase tracking-widest">{config.moneda} {config.moneda === 'USD' ? `(T/C: ${config.paridad})` : ''}</span>
                        </div>
                        <button onClick={handleExport} className="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg text-[10px] font-black uppercase transition-all">Exportar PDF</button>
                    </nav>

                    <div className="flex flex-col items-center p-4">
                        <div id="presupuesto-pdf" className="w-full max-w-[210mm] bg-white shadow-2xl p-8 md:p-14 border border-slate-200">
                            {/* Header */}
                            <div className="flex justify-between items-start border-b-4 border-slate-900 pb-8 mb-8">
                                <div className="flex-1 space-y-4">
                                    <div className="w-24 h-24 bg-slate-50 border-2 border-dashed flex items-center justify-center relative no-print rounded-xl">
                                        {logo ? <img src={logo} className="w-full h-full object-contain p-2" /> : <i data-lucide="image" className="text-slate-300"></i>}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => { const r=new FileReader(); r.onload=x=>setLogo(x.target.result); r.readAsDataURL(e.target.files[0]); }} />
                                    </div>
                                    {logo && <img src={logo} className="hidden print:block w-32 h-auto mb-4" />}
                                    <div className="space-y-1">
                                        <div className="text-[7px] font-black text-blue-600 uppercase">Obra</div>
                                        <input className="w-full text-sm font-black uppercase outline-none" value={project.obra} onChange={e=>setProject({...project, obra:e.target.value})} />
                                        <div className="text-[7px] font-black text-slate-400 uppercase">Mandante</div>
                                        <input className="w-full text-[11px] font-bold text-slate-700 uppercase outline-none" value={project.mandante} onChange={e=>setProject({...project, mandante:e.target.value})} />
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h1 className="text-3xl font-black italic tracking-tighter">PRESUPUESTO</h1>
                                    <div className="mt-8 text-right">
                                        <div className="text-[7px] font-black text-slate-400 uppercase">Fecha</div>
                                        <input type="date" className="text-xs font-black outline-none text-right bg-transparent" value={project.fecha} onChange={e=>setProject({...project, fecha:e.target.value})} />
                                    </div>
                                </div>
                            </div>

                            {/* Tabla */}
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-slate-900 text-white text-[9px] font-black uppercase">
                                        <th className="p-3 text-left w-[8%]">ÍTEM</th>
                                        <th className="p-3 text-left">DESCRIPCIÓN</th>
                                        <th className="p-3 text-center w-[8%]">UNI</th>
                                        <th className="p-3 text-right w-[12%]">CANT</th>
                                        <th className="p-3 text-right w-[15%]">P. UNIT</th>
                                        <th className="p-3 text-right w-[15%]">SUBTOTAL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {itemsWithIndex.map((item, idx) => (
                                        <React.Fragment key={item.id}>
                                            <tr className={`border-b ${item.type === 'capitulo' ? 'bg-slate-50 font-black border-slate-300' : 'border-slate-100'}`}>
                                                <td className="p-2 text-[10px] text-slate-400">{item.indexLabel}</td>
                                                <td className="p-2">
                                                    <input className={`w-full bg-transparent outline-none uppercase ${item.type === 'capitulo' ? 'text-[11px] font-black' : 'text-[10px]'}`} value={item.nombre} onChange={e=>updateItem(item.id, 'nombre', e.target.value)} />
                                                </td>
                                                <td className="p-2 text-center uppercase text-[9px] font-bold">{item.unidad}</td>
                                                <td className="p-2 text-right text-[10px] font-bold">{item.type==='partida' ? fmt(item.cant, 'cant') : ''}</td>
                                                <td className="p-2 text-right text-[10px] font-bold">{item.type==='partida' ? fmt(item.precio, 'precio') : ''}</td>
                                                <td className="p-2 text-right text-[10px] font-black">{item.type==='partida' ? fmt(item.cant * item.precio, 'subtotal') : ''}</td>
                                            </tr>
                                            <tr className="no-print">
                                                <td colSpan={6} className="p-1 px-4 text-right space-x-2 border-b border-slate-50">
                                                    <button onClick={()=>addItem(idx, 'capitulo')} className="text-[7px] bg-slate-700 text-white px-2 py-0.5 rounded opacity-50 hover:opacity-100">+ CAP</button>
                                                    <button onClick={()=>addItem(idx, 'partida')} className="text-[7px] bg-blue-600 text-white px-2 py-0.5 rounded opacity-50 hover:opacity-100">+ PAR</button>
                                                    <button onClick={()=>setItems(items.filter(i=>i.id!==item.id))} className="text-red-400 hover:text-red-600"><i data-lucide="trash-2" className="w-3 h-3 inline"></i></button>
                                                </td>
                                            </tr>
                                        </React.Fragment>
                                    ))}
                                </tbody>
                            </table>

                            {/* Totales */}
                            <div className="mt-10 flex justify-end">
                                <div className="w-full max-w-[280px] space-y-1">
                                    <div className="flex justify-between text-[10px] font-black text-slate-500"><span>COSTO DIRECTO</span><span>{fmt(totales.directo, 'subtotal')}</span></div>
                                    <div className="flex justify-between text-[10px] font-bold text-slate-400"><span>G. GENERAL ({globalGG}%)</span><span>{fmt(totales.ggTotal, 'subtotal')}</span></div>
                                    <div className="flex justify-between text-[10px] font-bold text-slate-400"><span>UTILIDAD ({globalUtil}%)</span><span>{fmt(totales.utilTotal, 'subtotal')}</span></div>
                                    <div className="flex justify-between text-xs font-black bg-slate-900 text-white p-3 rounded-lg my-2 uppercase tracking-widest"><span>Neto</span><span>{fmt(totales.neto, 'total')}</span></div>
                                    <div className="flex justify-between text-[10px] font-bold text-slate-500 px-1"><span>I.V.A 19%</span><span>{fmt(totales.iva, 'total')}</span></div>
                                    <div className="flex justify-between items-end border-t-2 border-slate-900 pt-3 mt-2">
                                        <span className="text-xs font-black text-blue-600 uppercase">Total {config.moneda}</span>
                                        <span className="text-2xl font-black">{fmt(totales.total, 'total')}</span>
                                    </div>
                                    <p className="text-[8px] text-right font-black italic text-slate-400 mt-2 uppercase">{numeroALetras(totales.total, config.moneda)}</p>
                                </div>
                            </div>

                            {/* Pie de página Full Width */}
                            <div className="mt-24 border-t-2 border-slate-200 pt-6">
                                <div className="w-full text-center">
                                    <input className="w-full text-center text-[11px] font-black uppercase outline-none bg-transparent" value={project.profesional} onChange={e=>setProject({...project, profesional:e.target.value})} />
                                    <input className="w-full text-center text-[8px] font-bold text-slate-400 outline-none bg-transparent mt-1" value={project.contacto} onChange={e=>setProject({...project, contacto:e.target.value})} />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Inicializar iconos de Lucide después de renderizar
        setTimeout(() => lucide.createIcons(), 500);
    </script>
</body>
</html>
