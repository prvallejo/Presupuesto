<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PresAI Software - Presupuesto de Obras</title>
    <!-- Librerías sin crossorigin para evitar bloqueos de seguridad en móviles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-print-color-adjust: exact; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .page-break { page-break-before: always; }
        @media print { .no-print { display: none !important; } .print-break { page-break-before: always; } }
        #root:empty { display: flex; height: 100vh; align-items: center; justify-content: center; font-weight: 900; color: #2563eb; }
        #root:empty::after { content: "CARGANDO PRESAI SOFTWARE..."; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const apiKey = ""; 

        // --- SVG ICONS BLINDADOS ---
        const I_Settings = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const I_X = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        // --- CONVERSOR A LETRAS ---
        const numeroALetras = (num, moneda) => {
            if(!num || num===0) return `SON: CERO ${moneda === 'CLP' ? 'PESOS' : 'DÓLARES'}.-`;
            const Unidades = (n) => ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE'][n];
            const Decenas = (n) => {
                if (n<10) return Unidades(n);
                if (n<20) return ['DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'][n-10];
                const d = Math.floor(n/10); const u = n%10;
                const t = ['','','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'][d];
                return u === 0 ? t : (d === 2 ? 'VEINTI' : t + ' Y ') + Unidades(u);
            };
            const Centenas = (n) => {
                if (n === 100) return 'CIEN';
                if (n < 100) return Decenas(n);
                const c = Math.floor(n/100); const r = n%100;
                const t = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'][c];
                return r === 0 ? t : t + ' ' + Decenas(r);
            };
            const miles = (n) => {
                if (n < 1000) return Centenas(n);
                const m = Math.floor(n/1000); const r = n%1000;
                const t = m === 1 ? 'MIL' : Centenas(m) + ' MIL';
                return r === 0 ? t : t + ' ' + Centenas(r);
            };
            const millones = (n) => {
                if (n < 1000000) return miles(n);
                const m = Math.floor(n/1000000); const r = n%1000000;
                const t = m === 1 ? 'UN MILLÓN' : Centenas(m) + ' MILLONES';
                return r === 0 ? t : t + ' ' + miles(r);
            };
            const entero = Math.floor(num);
            const centavos = Math.round((num - entero) * 100);
            const texto = millones(entero);
            const sufijo = moneda === 'CLP' ? 'PESOS' : 'DÓLARES';
            return `SON: ${texto} ${sufijo} ${centavos > 0 ? `CON ${centavos}/100` : ''}.-`.toUpperCase();
        };

        // --- GEMINI API ---
        const callGemini = async (prompt, systemPrompt, isJson = false) => {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        ...(isJson ? { generationConfig: { responseMimeType: "application/json" } } : {})
                    })
                });
                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (err) { console.error(err); return null; }
        };

        function App() {
            const [activeModal, setActiveModal] = useState(null);
            const [selectedId, setSelectedId] = useState(null);
            const [logo, setLogo] = useState(null);
            const [aiSummary, setAiSummary] = useState("");
            const [isAiLoading, setIsAiLoading] = useState(false);

            // --- ESTADOS PRINCIPALES ---
            const [config, setConfig] = useState({
                moneda: 'CLP', paridad: 950,
                decCant: 2, decApu: 0, decSub: 0, decTot: 0,
                printApu: true, printCub: true
            });

            const [footer, setFooter] = useState({
                empresa: 'CONSTRUCTORA SOLIRIAN',
                direccion: 'Av. Providencia 1234, Santiago',
                celular: '+56 9 1234 5678',
                correo: 'proyectos@solirian.cl'
            });

            const [project, setProject] = useState({
                obra: 'PROYECTO FOTOVOLTAICO - SOLIRIAN',
                mandante: 'LIBERTAD65 INVESTMENTS',
                ubicacion: 'SANTIAGO, CHILE',
                fecha: new Date().toISOString().split('T')[0]
            });

            const [items, setItems] = useState([
                { id: '1', type: 'capitulo', nombre: 'OBRAS PREVIAS', unidad: '', cant: 0, precio: 0 },
                { id: '2', type: 'partida', nombre: 'Instalación de faenas', unidad: 'GL', cant: 1, precio: 450000 },
            ]);

            const [estudioGG, setEstudioGG] = useState([{ desc: 'Seguros de Responsabilidad', monto: 120000 }]);
            const [globalGG, setGlobalGG] = useState(15);
            const [globalUtil, setGlobalUtil] = useState(10);
            
            const [apus, setApus] = useState({});
            const [cubicaciones, setCubicaciones] = useState({});

            // --- LÓGICA CORE: JERARQUÍA Y SUMA DE CAPÍTULOS ---
            const processedItems = useMemo(() => {
                let capCount = 0; let parCount = 0;
                let currentCapId = null;
                const sums = {};

                // Pasada 1: Sumar partidas en su capítulo
                items.forEach(i => {
                    if (i.type === 'capitulo') {
                        currentCapId = i.id;
                        sums[currentCapId] = 0;
                    } else if (i.type === 'partida' && currentCapId) {
                        sums[currentCapId] += (Number(i.cant) * Number(i.precio));
                    }
                });

                // Pasada 2: Asignar números y precios de capítulos
                return items.map(item => {
                    if (item.type === 'capitulo') {
                        capCount++; parCount = 0;
                        return { ...item, num: capCount.toString().padStart(2, '0'), precioTotal: sums[item.id] || 0 };
                    } else {
                        parCount++;
                        return { ...item, num: `${capCount.toString().padStart(2, '0')}.${parCount}` };
                    }
                });
            }, [items]);

            const fmt = (val, type) => {
                if (val === "" || val == null) return "";
                const dec = config[`dec${type}`] || 0;
                return Number(val).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
            };

            const totales = useMemo(() => {
                let directo = items.reduce((acc, i) => i.type === 'partida' ? acc + (Number(i.cant) * Number(i.precio)) : acc, 0);
                const gg = directo * (Number(globalGG) / 100);
                const util = directo * (Number(globalUtil) / 100);
                const neto = directo + gg + util;
                return { directo, gg, util, neto, iva: neto * 0.19, total: neto * 1.19 };
            }, [items, globalGG, globalUtil]);

            // --- HANDLERS ---
            const handleFocus = (e) => {
                const val = e.target.value.toLowerCase();
                if (val.includes("nueva partida") || val.includes("nuevo capítulo") || val.includes("nombre") || val === "0") {
                    e.target.value = "";
                }
            };

            const addItem = (idx, type) => {
                const newItem = { id: Math.random().toString(36).substr(2,9), type, nombre: type === 'capitulo' ? 'NUEVO CAPÍTULO' : 'Nueva partida', unidad: type === 'partida' ? 'UN' : '', cant: type === 'partida' ? 1 : 0, precio: 0 };
                const n = [...items]; n.splice(idx + 1, 0, newItem); setItems(n);
            };

            const exportPDF = async () => {
                const btn = document.getElementById('btn-export');
                const origText = btn.innerText;
                btn.innerText = "GENERANDO...";
                await loadHtml2Pdf();
                const opt = {
                    margin: 5, filename: `Presupuesto_${project.obra}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };
                await window.html2pdf().from(document.getElementById('presupuesto-doc')).set(opt).save();
                btn.innerText = origText;
            };

            // --- MODALES COMPLETAMENTE ESTABLES ---
            const ConfigModal = () => (
                <div className="fixed inset-0 bg-black/80 z-[1000] flex justify-center items-center p-4 backdrop-blur-sm">
                    <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col overflow-hidden max-h-[90vh]">
                        <div className="bg-blue-600 text-white p-5 flex justify-between items-center">
                            <h2 className="font-black text-sm uppercase tracking-widest flex items-center gap-2"><I_Settings/> Configuración</h2>
                            <button onClick={()=>setActiveModal(null)}><I_X/></button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="text-[10px] font-black text-slate-400 uppercase">Moneda</label>
                                <select className="w-full p-2 border-b-2 font-bold outline-none" value={config.moneda} onChange={e=>{
                                    const n = e.target.value; const f = n==='USD' ? (1/config.paridad) : config.paridad;
                                    setItems(items.map(i => ({...i, precio: i.precio * f})));
                                    setConfig({...config, moneda: n});
                                }}><option value="CLP">CLP</option><option value="USD">USD</option></select></div>
                                <div><label className="text-[10px] font-black text-slate-400 uppercase">Paridad (T/C)</label>
                                <input type="number" className="w-full p-2 border-b-2 font-bold outline-none" value={config.paridad} onChange={e=>setConfig({...config, paridad: e.target.value})} disabled={config.moneda==='CLP'}/></div>
                            </div>
                            <div className="grid grid-cols-4 gap-2 border-t pt-4">
                                {['Cant', 'Apu', 'Sub', 'Tot'].map((f, i) => (
                                    <div key={f}><label className="text-[8px] font-black text-slate-400 uppercase">Dec {f}</label>
                                    <input type="number" className="w-full p-2 bg-slate-50 rounded text-center font-bold outline-none border" value={config[`dec${['Cant','Apu','Sub','Tot'][i]}`]} onChange={e=>setConfig({...config, [`dec${['Cant','Apu','Sub','Tot'][i]}`]: parseInt(e.target.value)})} /></div>
                                ))}
                            </div>
                            <div className="border-t pt-4 space-y-2">
                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Impresión en PDF</label>
                                <label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={config.printApu} onChange={e=>setConfig({...config, printApu: e.target.checked})} className="w-4 h-4"/> Adjuntar Anexo APU</label>
                                <label className="flex items-center gap-2 text-sm font-bold"><input type="checkbox" checked={config.printCub} onChange={e=>setConfig({...config, printCub: e.target.checked})} className="w-4 h-4"/> Adjuntar Anexo Cubicaciones</label>
                            </div>
                            <div className="border-t pt-4 space-y-3">
                                <label className="text-[10px] font-black text-slate-400 uppercase block mb-2">Pie de Página</label>
                                <input className="w-full p-2 border rounded font-black text-xs uppercase outline-none" value={footer.empresa} onChange={e=>setFooter({...footer, empresa: e.target.value})} placeholder="Nombre Empresa"/>
                                <div className="grid grid-cols-3 gap-2">
                                    <input className="w-full p-2 border rounded text-[10px] font-bold outline-none" value={footer.direccion} onChange={e=>setFooter({...footer, direccion: e.target.value})} placeholder="Dirección"/>
                                    <input className="w-full p-2 border rounded text-[10px] font-bold outline-none" value={footer.celular} onChange={e=>setFooter({...footer, celular: e.target.value})} placeholder="Celular"/>
                                    <input className="w-full p-2 border rounded text-[10px] font-bold text-blue-600 outline-none" value={footer.correo} onChange={e=>setFooter({...footer, correo: e.target.value})} placeholder="Correo"/>
                                </div>
                            </div>
                        </div>
                        <button onClick={()=>setActiveModal(null)} className="m-4 bg-slate-900 text-white py-4 rounded-xl font-black text-xs uppercase shadow-xl hover:bg-slate-800">Guardar Configuración</button>
                    </div>
                </div>
            );

            const CubicarModal = () => {
                const p = items.find(i=>i.id===selectedId);
                const [r, setR] = useState(cubicaciones[selectedId] || [{d:'Eje 1',n:1,l:0,a:0,h:0}]);
                const t = r.reduce((acc, x) => acc + (Number(x.n)*(Number(x.l)||1)*(Number(x.a)||1)*(Number(x.h)||1)), 0);

                const updateRow = (i, field, val) => {
                    const n = [...r];
                    n[i] = { ...n[i], [field]: val };
                    setR(n);
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-[1000] flex justify-center items-center p-4">
                        <div className="bg-white w-full max-w-2xl rounded-2xl flex flex-col overflow-hidden">
                            <div className="bg-slate-800 text-white p-4 flex justify-between items-center">
                                <div><p className="text-[10px] font-bold text-slate-400">CUBICACIÓN</p><h3 className="font-black text-sm uppercase">{p.nombre}</h3></div>
                                <button onClick={()=>setActiveModal(null)}><I_X/></button>
                            </div>
                            <div className="p-4 overflow-auto max-h-[60vh]">
                                <table className="w-full text-xs text-center border-collapse">
                                    <thead className="bg-slate-100 font-black uppercase text-[9px]"><tr><th className="p-2 text-left">Detalle</th><th className="p-2">N</th><th className="p-2">Largo</th><th className="p-2">Ancho</th><th className="p-2">Alto</th><th className="p-2 text-right">SubT</th></tr></thead>
                                    <tbody>
                                        {r.map((x,i)=>(<tr key={i} className="border-b"><td className="p-1"><input className="w-full outline-none uppercase" value={x.d} onChange={e=>updateRow(i, 'd', e.target.value)}/></td><td><input type="number" className="w-10 text-center outline-none" value={x.n} onChange={e=>updateRow(i, 'n', e.target.value)}/></td><td><input type="number" className="w-10 text-center outline-none" value={x.l} onChange={e=>updateRow(i, 'l', e.target.value)}/></td><td><input type="number" className="w-10 text-center outline-none" value={x.a} onChange={e=>updateRow(i, 'a', e.target.value)}/></td><td><input type="number" className="w-10 text-center outline-none" value={x.h} onChange={e=>updateRow(i, 'h', e.target.value)}/></td><td className="p-1 text-right font-black">{fmt(Number(x.n)*(Number(x.l)||1)*(Number(x.a)||1)*(Number(x.h)||1), 'Cant')}</td></tr>))}
                                    </tbody>
                                </table>
                                <button onClick={()=>setR([...r,{d:'',n:1,l:0,a:0,h:0}])} className="mt-4 text-[10px] font-black text-blue-600">+ Añadir Fila</button>
                            </div>
                            <div className="p-4 bg-slate-50 border-t flex justify-between items-center">
                                <span className="font-black text-lg">TOTAL: {fmt(t,'Cant')} {p.unidad}</span>
                                <button onClick={()=>{setCubicaciones({...cubicaciones, [selectedId]:r}); updateItem(selectedId, 'cant', t); setActiveModal(null);}} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-black text-xs uppercase">Confirmar</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const ApuModal = () => {
                const p = items.find(i=>i.id===selectedId);
                const [la, setLa] = useState(apus[selectedId] || { mat:[], mo:[], eq:[], ls:30 });
                const [ld, setLd] = useState(false);

                const calc = () => {
                    const m = la.mat.reduce((a,b)=>a+(Number(b.c)*Number(b.p)),0);
                    const mo = la.mo.reduce((a,b)=>a+(Number(b.c)*Number(b.p)),0);
                    const eq = la.eq.reduce((a,b)=>a+(Number(b.c)*Number(b.p)),0);
                    return m + mo + (mo * (Number(la.ls)/100)) + eq;
                };

                const updateApuRow = (secId, i, field, val) => {
                    const newSec = [...la[secId]];
                    newSec[i] = { ...newSec[i], [field]: val };
                    setLa({ ...la, [secId]: newSec });
                };

                const suggest = async () => {
                    setLd(true);
                    const json = await callGemini(`Partida:"${p.nombre}",Unidad:"${p.unidad}". Moneda:${config.moneda}. Sugiere mercado.`, "Eres analista de costos. Responde solo JSON: {\"mat\":[{\"d\":\"\",\"u\":\"UN\",\"c\":1,\"p\":10}],\"mo\":[{\"d\":\"\",\"u\":\"HD\",\"c\":1,\"p\":10}],\"eq\":[{\"d\":\"\",\"u\":\"GL\",\"c\":1,\"p\":10}]}", true);
                    if(json) { const d=JSON.parse(json); setLa({mat:d.mat||[], mo:d.mo||[], eq:d.eq||[], ls:30}); }
                    setLd(false);
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-[1000] flex justify-center items-center p-2 backdrop-blur-sm">
                        <div className="bg-white w-full max-w-3xl rounded-2xl flex flex-col overflow-hidden max-h-[95vh]">
                            <div className="bg-orange-600 text-white p-4 flex justify-between items-center">
                                <div><p className="text-[10px] font-black uppercase tracking-widest">Estudio de Precio Unitario</p><h3 className="font-black text-sm uppercase">{p.nombre}</h3></div>
                                <div className="flex gap-2">
                                    <button onClick={suggest} disabled={ld} className="bg-orange-800 px-3 py-1.5 rounded-lg text-[9px] font-black uppercase shadow">{ld?'Cargando...':'Sugerir IA ✨'}</button>
                                    <button onClick={()=>setActiveModal(null)}><I_X/></button>
                                </div>
                            </div>
                            <div className="p-4 overflow-y-auto space-y-4 flex-1">
                                {[{id:'mat', t:'Materiales'},{id:'mo', t:'Mano de Obra'},{id:'eq', t:'Herramientas y Equipos'}].map(sec => (
                                    <div key={sec.id} className="border rounded-xl overflow-hidden">
                                        <div className="bg-slate-100 p-2 flex justify-between items-center"><span className="text-[10px] font-black uppercase text-slate-600">{sec.t}</span><button onClick={()=>setLa({...la, [sec.id]: [...la[sec.id], {d:'',u:'UN',c:1,p:0}]})} className="text-blue-600 text-xl leading-none">+</button></div>
                                        <table className="w-full text-[10px]">
                                            <thead className="bg-slate-50 uppercase font-black text-[8px] text-slate-400"><tr><th className="p-1 text-left">Desc</th><th className="p-1 w-10">Un</th><th className="p-1 w-16">Cant</th><th className="p-1 w-20 text-right">P.U</th></tr></thead>
                                            <tbody>{la[sec.id].map((r,i)=>(<tr key={i} className="border-t"><td className="p-1"><input className="w-full uppercase outline-none" value={r.d} onChange={e=>updateApuRow(sec.id, i, 'd', e.target.value)}/></td><td className="p-1"><input className="w-full text-center uppercase outline-none" value={r.u} onChange={e=>updateApuRow(sec.id, i, 'u', e.target.value)}/></td><td className="p-1"><input type="number" className="w-full text-center outline-none" value={r.c} onChange={e=>updateApuRow(sec.id, i, 'c', e.target.value)}/></td><td className="p-1"><input type="number" className="w-full text-right outline-none font-bold" value={r.p} onChange={e=>updateApuRow(sec.id, i, 'p', e.target.value)}/></td></tr>))}</tbody>
                                        </table>
                                    </div>
                                ))}
                                <div className="flex justify-between bg-orange-50 p-3 rounded-xl border border-orange-100 items-center">
                                    <span className="text-[10px] font-black uppercase text-orange-800">Leyes Sociales (%)</span>
                                    <input type="number" className="w-16 text-center font-black p-1 border rounded outline-none" value={la.ls} onChange={e=>setLa({...la, ls:e.target.value})} />
                                </div>
                            </div>
                            <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                                <div><p className="text-[8px] font-black text-slate-400 uppercase">P.U. Total ({config.moneda})</p><p className="text-xl font-black">{fmt(calc(), 'Apu')}</p></div>
                                <button onClick={()=>{setApus({...apus, [selectedId]:la}); updateItem(selectedId, 'precio', calc()); setActiveModal(null);}} className="bg-blue-600 px-8 py-3 rounded-xl font-black text-xs uppercase shadow">Guardar APU</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const GGModal = () => {
                const t = estudioGG.reduce((a,b)=>a+Number(b.monto),0);
                const perc = totales.directo > 0 ? (t / totales.directo) * 100 : 0;
                const updateGRow = (i, field, val) => {
                    const n = [...estudioGG]; n[i] = { ...n[i], [field]: val }; setEstudioGG(n);
                };
                return (
                    <div className="fixed inset-0 bg-black/80 z-[1000] flex justify-center items-center p-4 backdrop-blur-sm">
                        <div className="bg-white w-full max-w-lg rounded-2xl flex flex-col overflow-hidden">
                            <div className="bg-blue-600 text-white p-4 flex justify-between items-center"><h3 className="font-black text-sm uppercase">Estudio Gastos Generales</h3><button onClick={()=>setActiveModal(null)}><I_X/></button></div>
                            <div className="p-4 overflow-y-auto max-h-[60vh] space-y-2">
                                <div className="flex justify-between bg-blue-50 p-4 rounded-xl mb-4"><div className="text-center"><p className="text-[9px] font-black text-blue-400 uppercase">Total G.G.</p><p className="text-lg font-black text-blue-900">{config.moneda} {fmt(t, 'Tot')}</p></div><div className="text-center"><p className="text-[9px] font-black text-blue-400 uppercase">Incidencia</p><p className="text-lg font-black text-blue-900">{perc.toFixed(2)}%</p></div></div>
                                {estudioGG.map((g,i)=>(<div key={i} className="flex gap-2"><input className="flex-1 p-2 border-b uppercase text-xs font-bold outline-none" value={g.desc} onChange={e=>updateGRow(i, 'desc', e.target.value)} placeholder="Descripción de gasto..." /><input type="number" className="w-24 p-2 border-b text-right text-xs font-black outline-none" value={g.monto} onChange={e=>updateGRow(i, 'monto', e.target.value)} /><button onClick={()=>setEstudioGG(estudioGG.filter((_,idx)=>idx!==i))} className="text-red-400">❌</button></div>))}
                                <button onClick={()=>setEstudioGG([...estudioGG,{desc:'',monto:0}])} className="text-[10px] font-black text-blue-600 uppercase mt-4">+ Agregar Ítem</button>
                            </div>
                            <button onClick={()=>{setGlobalGG(perc.toFixed(2)); setActiveModal(null);}} className="m-4 bg-slate-900 text-white py-3 rounded-xl font-black text-xs uppercase hover:bg-slate-800">Aplicar {perc.toFixed(2)}% al Presupuesto</button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen">
                    <nav className="no-print bg-slate-900 text-white p-3 sticky top-0 z-[100] flex justify-between items-center shadow-xl">
                        <div className="flex items-center gap-3">
                            <button onClick={()=>setActiveModal('config')} className="bg-slate-800 p-2 rounded-lg text-blue-400"><I_Settings/></button>
                            <span className="text-[10px] font-black uppercase tracking-widest">{config.moneda} {config.moneda==='USD'?`($${config.paridad})`:''}</span>
                        </div>
                        <button id="btn-export" onClick={exportPDF} className="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg text-[10px] font-black uppercase shadow-lg shadow-blue-500/20 transition-all">Imprimir PDF</button>
                    </nav>

                    <div className="flex justify-center p-2 md:p-6 bg-slate-100">
                        <div id="presupuesto-doc" className="w-full max-w-[210mm] bg-white shadow-2xl p-6 md:p-12 flex flex-col border border-slate-200">
                            
                            {/* HEADER PÁGINA */}
                            <div className="flex justify-between items-start border-b-4 border-slate-900 pb-8 mb-8 gap-6">
                                <div className="flex-1 space-y-4 w-full">
                                    <div className="w-32 h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl relative no-print overflow-hidden group hover:border-blue-400 transition-all">
                                        {logo ? <img src={logo} className="w-full h-full object-contain" /> : <div className="w-full h-full flex items-center justify-center text-[8px] font-black text-slate-400 uppercase">Logo</div>}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e=>{const r=new FileReader(); r.onload=x=>setLogo(x.target.result); r.readAsDataURL(e.target.files[0]);}} />
                                    </div>
                                    {logo && <img src={logo} className="hidden print:block w-36 h-auto mb-4" />}
                                    <div className="space-y-1 pr-4">
                                        <input onFocus={handleFocus} className="w-full text-base font-black uppercase outline-none text-slate-900" value={project.obra} onChange={e=>setProject({...project,obra:e.target.value})} placeholder="NOMBRE OBRA" />
                                        <input onFocus={handleFocus} className="w-full text-[10px] font-bold uppercase text-slate-500 outline-none" value={project.mandante} onChange={e=>setProject({...project,mandante:e.target.value})} placeholder="MANDANTE" />
                                        <input onFocus={handleFocus} className="w-full text-[10px] font-bold uppercase text-slate-500 outline-none" value={project.ubicacion} onChange={e=>setProject({...project,ubicacion:e.target.value})} placeholder="UBICACIÓN" />
                                    </div>
                                </div>
                                <div className="text-right w-48">
                                    <h1 className="text-3xl font-black italic text-slate-900 tracking-tighter">PRESUPUESTO</h1>
                                    <div className="mt-10">
                                        <p className="text-[7px] font-black text-slate-400 uppercase tracking-widest">FECHA</p>
                                        <input type="date" className="text-xs font-black outline-none text-right bg-transparent" value={project.fecha} onChange={e=>setProject({...project,fecha:e.target.value})} />
                                    </div>
                                </div>
                            </div>

                            {/* TABLA DE COSTOS */}
                            <table className="w-full border-collapse">
                                <thead>
                                    <tr className="bg-slate-900 text-white text-[9px] font-black uppercase">
                                        <th className="p-3 text-left w-[8%]">ÍTEM</th>
                                        <th className="p-3 text-left">DESCRIPCIÓN</th>
                                        <th className="p-3 text-center w-[8%]">UNI</th>
                                        <th className="p-3 text-right w-[12%]">CANT</th>
                                        <th className="p-3 text-right w-[16%]">P.UNIT ({config.moneda})</th>
                                        <th className="p-3 text-right w-[18%]">SUBTOT</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {processedItems.map((item, idx) => (
                                        <tr key={item.id} className={`border-b ${item.type==='capitulo'?'bg-slate-100 font-black border-slate-300':'border-slate-100 hover:bg-slate-50'}`}>
                                            <td className="p-2 text-[10px] font-bold text-slate-500">{item.num}</td>
                                            <td className="p-2 flex items-center justify-between group">
                                                <input onFocus={handleFocus} className={`w-full bg-transparent outline-none uppercase ${item.type==='capitulo'?'text-[11px] font-black text-slate-900':'text-[10px] font-bold text-slate-700'}`} value={item.nombre} onChange={e=>updateItem(item.id,'nombre',e.target.value)} />
                                                <div className="no-print opacity-0 group-hover:opacity-100 flex gap-1 bg-white p-1 rounded shadow-sm">
                                                    <button onClick={()=>addItem(idx, 'capitulo')} className="text-slate-400 hover:text-slate-900" title="Añadir Capítulo">➕</button>
                                                    <button onClick={()=>addItem(idx, 'partida')} className="text-blue-400 hover:text-blue-700" title="Añadir Partida">➕</button>
                                                    <button onClick={()=>deleteItem(item.id)} className="text-red-300 hover:text-red-500">❌</button>
                                                </div>
                                            </td>
                                            <td className="p-2"><input onFocus={handleFocus} className="w-full text-center bg-transparent outline-none text-[9px] uppercase font-black" value={item.unidad} onChange={e=>updateItem(item.id,'unidad',e.target.value)} /></td>
                                            <td className="p-2 text-right">
                                                <div className="flex items-center justify-end gap-1">
                                                    <input onFocus={handleFocus} type="number" className="w-full text-right bg-transparent outline-none text-[10px] font-black" value={item.type==='partida'?item.cant:''} onChange={e=>updateItem(item.id,'cant',e.target.value)} disabled={item.type==='capitulo'} />
                                                    {item.type==='partida' && <button onClick={()=>{setSelectedId(item.id); setActiveModal('cubicar');}} className="no-print text-sm hover:scale-110 transition-transform" title="Cubicar">🧱</button>}
                                                </div>
                                            </td>
                                            <td className="p-2 text-right">
                                                <div className="flex items-center justify-end gap-1">
                                                    {item.type==='capitulo' ? (
                                                        <span className="text-[10px] font-black">{fmt(item.precioTotal, 'Apu')}</span>
                                                    ) : (
                                                        <>
                                                            <input onFocus={handleFocus} type="number" className="w-full text-right bg-transparent outline-none text-[10px] font-black text-blue-700" value={item.precio} onChange={e=>updateItem(item.id,'precio',e.target.value)} />
                                                            <button onClick={()=>{setSelectedId(item.id); setActiveModal('apu');}} className="no-print text-sm hover:scale-110 transition-transform" title="Análisis P.U.">💵</button>
                                                        </>
                                                    )}
                                                </div>
                                            </td>
                                            <td className="p-2 text-right text-[10px] font-black text-slate-900">{item.type==='partida'?fmt(item.cant*item.precio, 'Sub'):fmt(item.precioTotal, 'Sub')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>

                            {/* TOTALES */}
                            <div className="mt-8 flex justify-end border-t-4 border-slate-900 pt-6">
                                <div className="w-[300px] space-y-2">
                                    <div className="flex justify-between text-[11px] font-black text-slate-500 uppercase"><span>Costo Directo</span><span>{fmt(totales.directo, 'Sub')}</span></div>
                                    <div className="flex justify-between items-center text-[11px] font-bold text-slate-600 uppercase border-b border-slate-100 pb-1">
                                        <div className="flex items-center gap-1">G. Generales <input onFocus={handleFocus} type="number" className="no-print w-8 bg-slate-100 text-center font-black rounded text-[10px] ml-1 outline-none" value={globalGG} onChange={e=>setGlobalGG(e.target.value)}/><span className="print:inline hidden">({globalGG}%)</span> <button onClick={()=>setActiveModal('gg')} className="no-print ml-1 text-sm hover:scale-110 transition-transform" title="Estudio G.G.">💼</button></div>
                                        <span>{fmt(totales.gg, 'Sub')}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-[11px] font-bold text-slate-600 uppercase border-b border-slate-100 pb-1">
                                        <div className="flex items-center gap-1">Utilidades <input onFocus={handleFocus} type="number" className="no-print w-8 bg-slate-100 text-center font-black rounded text-[10px] ml-1 outline-none" value={globalUtil} onChange={e=>setGlobalUtil(e.target.value)}/><span className="print:inline hidden">({globalUtil}%)</span></div>
                                        <span>{fmt(totales.util, 'Sub')}</span>
                                    </div>
                                    <div className="flex justify-between text-xs font-black bg-slate-900 text-white p-3 rounded-xl mt-3 shadow-md uppercase tracking-widest"><span>Neto</span><span>{fmt(totales.neto, 'Tot')}</span></div>
                                    <div className="flex justify-between text-[10px] font-bold text-slate-400 px-2 uppercase"><span>I.V.A. 19%</span><span>{fmt(totales.iva, 'Tot')}</span></div>
                                    <div className="flex justify-between items-end border-t-2 border-slate-900 pt-3 mt-3">
                                        <span className="text-[13px] font-black text-blue-600 uppercase">Total Presupuesto</span>
                                        <span className="text-2xl font-black text-slate-900 leading-none">{config.moneda} {fmt(totales.total, 'Tot')}</span>
                                    </div>
                                    <p className="text-[8px] text-right font-black italic text-slate-500 mt-2 uppercase">{numeroALetras(totales.total, config.moneda)}</p>
                                </div>
                            </div>

                            {/* IA SUMMARY (NO PRINT if empty) */}
                            <div className="no-print mt-8 bg-indigo-50 border border-indigo-100 p-4 rounded-2xl flex items-center justify-between">
                                <div className="flex-1 pr-6">
                                    <p className="text-[9px] font-black text-indigo-800 uppercase tracking-widest mb-1 flex items-center gap-1">Resumen Ejecutivo Inteligente</p>
                                    <p className="text-[10px] font-medium italic text-indigo-900/70">{aiSummary || "Genera una propuesta comercial automática basada en los montos y partidas."}</p>
                                </div>
                                <button onClick={async()=>{
                                    setIsAiLoading(true);
                                    const r = await callGemini(`Obra:${project.obra}, Total:${totales.total}. Resume en 1 párrafo profesional.`, "Eres consultor. Resume técnico y formal.");
                                    if(r) setAiSummary(r.replace(/"/g, ''));
                                    setIsAiLoading(false);
                                }} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase shadow-lg shadow-indigo-600/30">{isAiLoading ? 'Pensando...' : 'Generar IA ✨'}</button>
                            </div>
                            {aiSummary && <div className="hidden print:block mt-8 p-4 bg-slate-50 rounded-xl border border-slate-200"><p className="text-[8px] font-black uppercase text-slate-400 mb-1">Resumen del Proyecto</p><p className="text-[9px] font-medium italic">{aiSummary}</p></div>}

                            {/* PIE DE PÁGINA FULL WIDTH */}
                            <div className="mt-20 pt-6 border-t-4 border-slate-100">
                                <input onFocus={handleFocus} className="w-full text-center text-sm font-black uppercase outline-none bg-transparent tracking-widest text-slate-800" value={footer.empresa} onChange={e=>setFooter({...footer, empresa:e.target.value})} placeholder="NOMBRE EMPRESA" />
                                <div className="flex justify-center gap-2 mt-1">
                                    <input onFocus={handleFocus} className="text-center text-[9px] font-bold uppercase text-slate-400 outline-none bg-transparent w-auto" value={footer.direccion} onChange={e=>setFooter({...footer, direccion:e.target.value})} placeholder="DIRECCIÓN" /> <span className="text-slate-300">|</span>
                                    <input onFocus={handleFocus} className="text-center text-[9px] font-bold uppercase text-slate-400 outline-none bg-transparent w-auto" value={footer.celular} onChange={e=>setFooter({...footer, celular:e.target.value})} placeholder="CELULAR" /> <span className="text-slate-300">|</span>
                                    <input onFocus={handleFocus} className="text-center text-[9px] font-bold text-blue-600 outline-none bg-transparent w-auto" value={footer.correo} onChange={e=>setFooter({...footer, correo:e.target.value})} placeholder="CORREO" />
                                </div>
                            </div>
                            
                            {/* BRANDING MARCA AGUA */}
                            <div className="mt-16 text-center opacity-[0.03] select-none pointer-events-none pb-4">
                                <h4 className="text-2xl font-black uppercase italic tracking-[0.5em]">PresAI Software de presupuesto de obras</h4>
                            </div>

                            {/* ANEXOS IMPRESIÓN (Condicionales) */}
                            {config.printApu && (
                                <div className="print-break hidden print:block pt-10">
                                    <h2 className="text-2xl font-black italic border-b-4 border-slate-900 pb-4 mb-8">ANEXO 1: ANÁLISIS DE PRECIOS UNITARIOS</h2>
                                    {processedItems.filter(i=>i.type==='partida' && apus[i.id]).map(item => (
                                        <div key={`apu-${item.id}`} className="mb-8 border border-slate-200 rounded-xl overflow-hidden page-break-inside-avoid">
                                            <div className="bg-slate-100 p-3 font-black text-[10px] uppercase flex justify-between"><span>{item.num} {item.nombre}</span><span>{config.moneda} {fmt(item.precio, 'Apu')}</span></div>
                                            <table className="w-full text-[9px]">
                                                <thead className="bg-slate-50 border-b"><tr><th className="p-2 text-left">Recurso</th><th className="p-2 text-center">Unidad</th><th className="p-2 text-right">Cant</th><th className="p-2 text-right">P.U.</th></tr></thead>
                                                <tbody>
                                                    {['mat', 'mo', 'eq'].map(s => (apus[item.id][s] || []).map((r, i) => (
                                                        <tr key={`${s}-${i}`} className="border-b border-slate-50"><td className="p-1.5 pl-3">{r.d}</td><td className="p-1.5 text-center">{r.u}</td><td className="p-1.5 text-right">{r.c}</td><td className="p-1.5 text-right">{fmt(r.p, 'Apu')}</td></tr>
                                                    )))}
                                                </tbody>
                                            </table>
                                        </div>
                                    ))}
                                </div>
                            )}
                            {config.printCub && (
                                <div className="print-break hidden print:block pt-10">
                                    <h2 className="text-2xl font-black italic border-b-4 border-slate-900 pb-4 mb-8">ANEXO 2: MEMORIA DE CUBICACIONES</h2>
                                    {processedItems.filter(i=>i.type==='partida' && cubicaciones[i.id]).map(item => (
                                        <div key={`cub-${item.id}`} className="mb-6 border border-slate-200 rounded-xl overflow-hidden page-break-inside-avoid">
                                            <div className="bg-slate-100 p-2 font-black text-[10px] uppercase flex justify-between"><span>{item.num} {item.nombre}</span><span>TOTAL: {fmt(item.cant, 'Cant')} {item.unidad}</span></div>
                                            <table className="w-full text-[9px] text-center"><thead className="bg-slate-50 border-b"><tr><th>Detalle</th><th>N</th><th>L</th><th>A</th><th>H</th></tr></thead><tbody>
                                                {(cubicaciones[item.id] || []).map((r,i)=><tr key={i} className="border-b border-slate-50"><td className="p-1 text-left pl-3">{r.d}</td><td className="p-1">{r.n}</td><td className="p-1">{r.l}</td><td className="p-1">{r.a}</td><td className="p-1">{r.h}</td></tr>)}
                                            </tbody></table>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* MODALES RENDERIZADOS */}
                    {activeModal === 'config' && <ConfigModal />}
                    {activeModal === 'cubicar' && <CubicarModal />}
                    {activeModal === 'apu' && <ApuModal />}
                    {activeModal === 'gg' && <GGModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
