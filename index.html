<body class="bg-slate-100 text-slate-900">
    <div id="root"></div>

            Settings: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>,

            Plus: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M5 12h14"/><path d="M12 5v14"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>,
            Edit: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        };

            const [activeModal, setActiveModal] = useState(null);
            const [activeTab, setActiveTab] = useState('config');
            const [selectedItemId, setSelectedItemId] = useState(null);
            const [logo, setLogo] = useState(null);

                moneda: 'CLP', paridad: 950,
                decimalesCant: 2, decimalesPrecio: 0,
                decimalesSubtotal: 0, decimalesTotal: 0
            });

            const [project, setProject] = useState({ 
                obra: 'PROYECTO FOTOVOLTAICO - SOLIRIAN', 
                mandante: 'MANDANTE EJEMPLO SPA', 
                ubicacion: 'SANTIAGO, CHILE', 
                fecha: new Date().toISOString().split('T')[0],
                profesional: 'CONSTRUCTORA SOLIRIAN & LIBERTAD65',
                contacto: 'contacto@solirian.cl | +56 9 1234 5678'
            });

            const [items, setItems] = useState([
                { id: '1', type: 'capitulo', nombre: '1. OBRAS PREVIAS', unidad: '', cant: 0, precio: 0 },
                { id: '2', type: 'partida', nombre: 'Instalación de faenas', unidad: 'GL', cant: 1, precio: 450000 },
            ]);

            const [estudioGG, setEstudioGG] = useState([{ desc: 'Seguros contra accidentes', monto: 120000 }]);
            const [globalGG, setGlobalGG] = useState(15);
            const [globalUtil, setGlobalUtil] = useState(10);

            const fmt = (val, type = 'precio') => {
                const dec = config[`decimales${type.charAt(0).toUpperCase() + type.slice(1)}`] || 0;
                return Number(val || 0).toLocaleString('de-DE', { minimumFractionDigits: dec, maximumFractionDigits: dec });
            };

            const totales = useMemo(() => {
                let directo = items.reduce((acc, i) => i.type === 'partida' ? acc + (i.cant * i.precio) : acc, 0);
                const gg = directo * (globalGG / 100);
                const util = directo * (globalUtil / 100);
                const neto = directo + gg + util;
                return { directo, gg, util, neto, iva: neto * 0.19, total: neto * 1.19 };
            }, [items, globalGG, globalUtil]);

            const handleLogo = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (x) => setLogo(x.target.result);
                    reader.readAsDataURL(file);
                }
            };

                            <select className="w-full p-2 font-bold bg-white border rounded-lg" value={config.moneda} onChange={e=>setConfig({...config, moneda: e.target.value})}>
                                <option value="CLP">PESOS (CLP)</option>
                                <option value="USD">DÓLARES (USD)</option>
                            </select>
                        </div>
                        <div className="p-4 bg-slate-50 rounded-2xl border">
                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">Tasa de Cambio</label>
                            <input type="number" className="w-full p-2 font-bold bg-white border rounded-lg" value={config.paridad} onChange={e=>setConfig({...config, paridad: e.target.value})} />
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4 border-t pt-6">
                        <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                            <label className="block text-[10px] font-black text-blue-400 mb-2 uppercase">Gastos Generales %</label>
                            <input type="number" className="w-full p-2 font-black text-blue-700 bg-white border rounded-lg" value={globalGG} onChange={e=>setGlobalGG(e.target.value)} />
                        </div>
                        <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                            <label className="block text-[10px] font-black text-blue-400 mb-2 uppercase">Utilidad %</label>
                            <input type="number" className="w-full p-2 font-black text-blue-700 bg-white border rounded-lg" value={globalUtil} onChange={e=>setGlobalUtil(e.target.value)} />
                        </div>
                    </div>
                </div>
            );

            const APUPanel = () => {
                const item = items.find(i => i.id === selectedItemId);
                if (!item) return <p className="text-center py-10 font-bold text-slate-300 uppercase">Selecciona una partida en la tabla</p>;
                return (
                    <div className="space-y-4">
                        <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl">
                            <p className="text-[9px] font-black text-blue-400 mb-1 uppercase tracking-widest">Análisis de Precio Unitario (APU)</p>
                            <h3 className="text-xl font-black uppercase italic">{item.nombre}</h3>
                        </div>
                        <div className="p-6 border-2 border-blue-100 rounded-3xl bg-blue-50/50">
                            <label className="block text-[10px] font-black text-blue-500 mb-2 uppercase">Precio Unitario Directo</label>
                            <div className="flex items-center gap-4">
                                <span className="text-2xl font-black text-blue-900">{config.moneda}</span>

                            </div>
                        </div>
                        <p className="text-[10px] font-bold text-slate-400 text-center uppercase italic">El cambio se refleja automáticamente en el presupuesto</p>
                    </div>
                );

                const totalMonto = estudioGG.reduce((a,b) => a + Number(b.monto), 0);
                const incidencia = totales.directo > 0 ? (totalMonto / totales.directo) * 100 : 0;
                return (
                    <div className="space-y-6">
                        <div className="bg-orange-500 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
                            <div><p className="text-[9px] font-black uppercase opacity-70">Total Gastos Indirectos</p><p className="text-2xl font-black">{fmt(totalMonto, 'total')}</p></div>
                            <div className="text-right"><p className="text-[9px] font-black uppercase opacity-70">Incidencia Directa</p><p className="text-2xl font-black">{incidencia.toFixed(2)}%</p></div>
                        </div>
                        {estudioGG.map((g, idx) => (
                            <div key={idx} className="flex gap-3 items-center group">

                            </div>

                    </div>

                                <Icons.Edit /><span className="text-[10px] font-black uppercase">Gastos Grales</span>
                            </button>
                        </div>

                    </nav>

                    <div className="flex justify-center p-4">
                        <div className="w-full max-w-[210mm] bg-white shadow-2xl p-8 md:p-16 min-h-[297mm] flex flex-col border border-slate-200">
                            
                            {/* CABECERA */}
                            <div className="flex justify-between items-start border-b-8 border-slate-900 pb-10 mb-10">
                                <div className="space-y-6 flex-1">
                                    <div className="w-40 h-40 bg-slate-50 border-4 border-dashed rounded-3xl relative no-print overflow-hidden group hover:border-blue-400 transition-all flex items-center justify-center">
                                        {logo ? <img src={logo} className="w-full h-full object-contain p-4" /> : <div className="text-center text-slate-300 font-black text-[10px] uppercase">Click p/ Logo</div>}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleLogo} />
                                    </div>
                                    {logo && <img src={logo} className="hidden print:block w-48 h-auto" />}
                                    <div className="space-y-4">
                                        <div className="border-l-4 border-blue-600 pl-4">

                                            <input className="w-full text-2xl font-black uppercase outline-none focus:text-blue-800" value={project.obra} onChange={e=>setProject({...project, obra:e.target.value})} />
                                        </div>
                                        <div className="pl-5">
                                            <p className="text-[8px] font-black text-slate-400 uppercase">Mandante</p>
                                            <input className="w-full text-sm font-bold uppercase text-slate-600 outline-none" value={project.mandante} onChange={e=>setProject({...project, mandante:e.target.value})} />
                                        </div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h1 className="text-5xl font-black italic text-slate-900 tracking-tighter">PRESUPUESTO</h1>
                                    <div className="bg-blue-600 text-white px-4 py-1.5 text-[9px] font-black rounded-full inline-block mt-4 uppercase tracking-tighter">SOLIRIAN PRO v2.9</div>
                                    <div className="mt-14">
                                        <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Fecha de Oferta</p>
                                        <input type="date" className="text-base font-black outline-none text-right bg-transparent" value={project.fecha} onChange={e=>setProject({...project, fecha:e.target.value})} />
                                    </div>
                                </div>
                            </div>

                            {/* TABLA */}
                            <div className="flex-grow">
                                <table className="w-full">
                                    <thead className="bg-slate-900 text-white text-[10px] font-black uppercase">
                                        <tr>
                                            <th className="p-4 text-left rounded-tl-2xl">DESCRIPCIÓN</th>
                                            <th className="p-4 text-center w-20">UNID</th>
                                            <th className="p-4 text-right w-24">CANT</th>
                                            <th className="p-4 text-right w-32">P. UNIT</th>
                                            <th className="p-4 text-right w-36 rounded-tr-2xl">TOTAL</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-[11px]">
                                        {items.map((item, idx) => (
                                            <tr key={item.id} className={`border-b ${item.type === 'capitulo' ? 'bg-slate-50 font-black' : 'hover:bg-blue-50/30 transition-colors'}`}>
                                                <td className="p-3">
                                                    <input className="w-full bg-transparent outline-none uppercase font-bold" value={item.nombre} onChange={e=>updateItem(item.id, 'nombre', e.target.value)} />
                                                </td>

                                                <td className="p-3 text-right"><input className="w-full text-right bg-transparent outline-none font-bold" type="number" value={item.cant} onChange={e=>updateItem(item.id, 'cant', e.target.value)} /></td>

                                                    </div>
                                                </td>
                                                <td className="p-3 text-right font-black">{fmt(item.cant * item.precio, 'subtotal')}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="no-print flex gap-4 mt-6">
                                    <button onClick={()=>setItems([...items, {id:Date.now(), type:'capitulo', nombre:'NUEVO CAPITULO', unidad:'', cant:0, precio:0}])} className="px-4 py-2 bg-slate-800 text-white text-[9px] font-black rounded-lg uppercase">+ Capitulo</button>
                                    <button onClick={()=>setItems([...items, {id:Date.now(), type:'partida', nombre:'Nueva Partida', unidad:'UN', cant:1, precio:0}])} className="px-4 py-2 bg-blue-600 text-white text-[9px] font-black rounded-lg uppercase">+ Partida</button>
                                </div>
                            </div>

                            {/* TOTALES */}
                            <div className="mt-16 flex justify-between border-t-4 border-slate-900 pt-10">

                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">Moneda</label>
                            <select className="w-full p-2 font-bold bg-white border rounded-lg" value={config.moneda} onChange={e=>setConfig({...config, moneda: e.target.value})}>
                                <option value="CLP">PESOS (CLP)</option>
                                <option value="USD">DÓLARES (USD)</option>
                            </select>
                        </div>
                        <div className="p-4 bg-slate-50 rounded-2xl border">
                            <label className="block text-[10px] font-black text-slate-400 mb-2 uppercase">Tasa de Cambio</label>
                            <input type="number" className="w-full p-2 font-bold bg-white border rounded-lg" value={config.paridad} onChange={e=>setConfig({...config, paridad: e.target.value})} />
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4 border-t pt-6">
                        <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                            <label className="block text-[10px] font-black text-blue-400 mb-2 uppercase">Gastos Generales %</label>
                            <input type="number" className="w-full p-2 font-black text-blue-700 bg-white border rounded-lg" value={globalGG} onChange={e=>setGlobalGG(e.target.value)} />
                        </div>
                        <div className="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                            <label className="block text-[10px] font-black text-blue-400 mb-2 uppercase">Utilidad %</label>
                            <input type="number" className="w-full p-2 font-black text-blue-700 bg-white border rounded-lg" value={globalUtil} onChange={e=>setGlobalUtil(e.target.value)} />
                        </div>
                    </div>
                </div>
            );

            const APUPanel = () => {
                const item = items.find(i => i.id === selectedItemId);
                if (!item) return <p className="text-center py-10 font-bold text-slate-300 uppercase">Selecciona una partida en la tabla</p>;
                return (
                    <div className="space-y-4">
                        <div className="bg-slate-900 text-white p-6 rounded-3xl shadow-xl">
                            <p className="text-[9px] font-black text-blue-400 mb-1 uppercase tracking-widest">Análisis de Precio Unitario (APU)</p>
                            <h3 className="text-xl font-black uppercase italic">{item.nombre}</h3>
                        </div>
                        <div className="p-6 border-2 border-blue-100 rounded-3xl bg-blue-50/50">
                            <label className="block text-[10px] font-black text-blue-500 mb-2 uppercase">Precio Unitario Directo</label>
                            <div className="flex items-center gap-4">
                                <span className="text-2xl font-black text-blue-900">{config.moneda}</span>
                                <input type="number" className="flex-1 p-4 text-3xl font-black text-slate-900 border-none bg-transparent outline-none focus:ring-0" 
                                    value={item.precio} onChange={e => updateItem(item.id, 'precio', e.target.value)} />
                            </div>
                        </div>
                        <p className="text-[10px] font-bold text-slate-400 text-center uppercase italic">El cambio se refleja automáticamente en el presupuesto</p>
                    </div>
                );
            };

            const GGPanel = () => {
                const totalMonto = estudioGG.reduce((a,b) => a + Number(b.monto), 0);
                const incidencia = totales.directo > 0 ? (totalMonto / totales.directo) * 100 : 0;
                return (
                    <div className="space-y-6">
                        <div className="bg-orange-500 text-white p-6 rounded-3xl shadow-xl flex justify-between items-center">
                            <div><p className="text-[9px] font-black uppercase opacity-70">Total Gastos Indirectos</p><p className="text-2xl font-black">{fmt(totalMonto, 'total')}</p></div>
                            <div className="text-right"><p className="text-[9px] font-black uppercase opacity-70">Incidencia Directa</p><p className="text-2xl font-black">{incidencia.toFixed(2)}%</p></div>
                        </div>
                        {estudioGG.map((g, idx) => (
                            <div key={idx} className="flex gap-3 items-center group">
                                <input className="flex-1 p-3 border-b-2 border-slate-100 focus:border-blue-500 outline-none uppercase text-xs font-bold" value={g.desc} onChange={e=>{let n=[...estudioGG]; n[idx].desc=e.target.value; setEstudioGG(n);}} />
                                <input type="number" className="w-32 p-3 border-b-2 border-slate-100 focus:border-blue-500 text-right font-black text-xs" value={g.monto} onChange={e=>{let n=[...estudioGG]; n[idx].monto=e.target.value; setEstudioGG(n);}} />
                                <button onClick={()=>setEstudioGG(estudioGG.filter((_,i)=>i!==idx))} className="text-slate-300 hover:text-red-500"><Icons.Trash /></button>
                            </div>
                        ))}
                        <button onClick={()=>setEstudioGG([...estudioGG, {desc:'NUEVO GASTO', monto:0}])} className="w-full py-4 border-2 border-dashed border-slate-200 rounded-2xl text-[10px] font-black text-slate-400 uppercase hover:bg-slate-50">+ Agregar ítem de gasto</button>
                    </div>
                );
            };

            return (
                <div className="min-h-screen pb-20">
                    <nav className="no-print bg-slate-900 text-white p-4 sticky top-0 z-[100] flex justify-between items-center shadow-xl">
                        <div className="flex gap-4">
                            <button onClick={()=>{setActiveModal('main'); setActiveTab('config');}} className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20 transition-all">
                                <Icons.Settings /><span className="text-[10px] font-black uppercase">Ajustes</span>
                            </button>
                            <button onClick={()=>{setActiveModal('main'); setActiveTab('gg');}} className="flex items-center gap-2 bg-white/10 px-4 py-2 rounded-xl hover:bg-white/20 transition-all">
                                <Icons.Edit /><span className="text-[10px] font-black uppercase">Gastos Grales</span>
                            </button>
                        </div>
                        <button onClick={()=>window.print()} className="bg-blue-600 hover:bg-blue-700 px-8 py-2.5 rounded-xl text-[11px] font-black uppercase transition-transform active:scale-95">Imprimir / PDF</button>
                    </nav>

                    <div className="flex justify-center p-4">
                        <div className="w-full max-w-[210mm] bg-white shadow-2xl p-8 md:p-16 min-h-[297mm] flex flex-col border border-slate-200">
                            
                            {/* CABECERA */}
                            <div className="flex justify-between items-start border-b-8 border-slate-900 pb-10 mb-10">
                                <div className="space-y-6 flex-1">
                                    <div className="w-40 h-40 bg-slate-50 border-4 border-dashed rounded-3xl relative no-print overflow-hidden group hover:border-blue-400 transition-all flex items-center justify-center">
                                        {logo ? <img src={logo} className="w-full h-full object-contain p-4" /> : <div className="text-center text-slate-300 font-black text-[10px] uppercase">Click p/ Logo</div>}
                                        <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleLogo} />
                                    </div>
                                    {logo && <img src={logo} className="hidden print:block w-48 h-auto" />}
                                    <div className="space-y-4">
                                        <div className="border-l-4 border-blue-600 pl-4">
                                            <p className="text-[8px] font-black text-blue-600 uppercase tracking-widest">Proyecto</p>
                                            <input className="w-full text-2xl font-black uppercase outline-none focus:text-blue-800" value={project.obra} onChange={e=>setProject({...project, obra:e.target.value})} />
                                        </div>
                                        <div className="pl-5">
                                            <p className="text-[8px] font-black text-slate-400 uppercase">Mandante</p>
                                            <input className="w-full text-sm font-bold uppercase text-slate-600 outline-none" value={project.mandante} onChange={e=>setProject({...project, mandante:e.target.value})} />
                                        </div>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <h1 className="text-5xl font-black italic text-slate-900 tracking-tighter">PRESUPUESTO</h1>
                                    <div className="bg-blue-600 text-white px-4 py-1.5 text-[9px] font-black rounded-full inline-block mt-4 uppercase tracking-tighter">SOLIRIAN PRO v2.9</div>
                                    <div className="mt-14">
                                        <p className="text-[8px] font-black text-slate-400 uppercase tracking-widest">Fecha de Oferta</p>
                                        <input type="date" className="text-base font-black outline-none text-right bg-transparent" value={project.fecha} onChange={e=>setProject({...project, fecha:e.target.value})} />
                                    </div>
                                </div>
                            </div>

                            {/* TABLA */}
                            <div className="flex-grow">
                                <table className="w-full">
                                    <thead className="bg-slate-900 text-white text-[10px] font-black uppercase">
                                        <tr>
                                            <th className="p-4 text-left rounded-tl-2xl">DESCRIPCIÓN</th>
                                            <th className="p-4 text-center w-20">UNID</th>
                                            <th className="p-4 text-right w-24">CANT</th>
                                            <th className="p-4 text-right w-32">P. UNIT</th>
                                            <th className="p-4 text-right w-36 rounded-tr-2xl">TOTAL</th>
                                        </tr>
                                    </thead>
                                    <tbody className="text-[11px]">
                                        {items.map((item, idx) => (
                                            <tr key={item.id} className={`border-b ${item.type === 'capitulo' ? 'bg-slate-50 font-black' : 'hover:bg-blue-50/30 transition-colors'}`}>
                                                <td className="p-3">
                                                    <input className="w-full bg-transparent outline-none uppercase font-bold" value={item.nombre} onChange={e=>updateItem(item.id, 'nombre', e.target.value)} />
                                                </td>
                                                <td className="p-3 text-center"><input className="w-full text-center bg-transparent outline-none uppercase" value={item.unidad} onChange={e=>updateItem(item.id, 'unidad', e.target.value)} /></td>
                                                <td className="p-3 text-right"><input className="w-full text-right bg-transparent outline-none font-bold" type="number" value={item.cant} onChange={e=>updateItem(item.id, 'cant', e.target.value)} /></td>
                                                <td className="p-3">
                                                    <div className="flex items-center justify-end gap-2 group">
                                                        <span className="font-black text-slate-900">{fmt(item.precio)}</span>
                                                        <button onClick={()=>{setSelectedItemId(item.id); setActiveModal('main'); setActiveTab('apu');}} className="no-print opacity-0 group-hover:opacity-100 text-blue-500"><Icons.Edit /></button>
                                                    </div>
                                                </td>
                                                <td className="p-3 text-right font-black">{fmt(item.cant * item.precio, 'subtotal')}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                <div className="no-print flex gap-4 mt-6">
                                    <button onClick={()=>setItems([...items, {id:Date.now(), type:'capitulo', nombre:'NUEVO CAPITULO', unidad:'', cant:0, precio:0}])} className="px-4 py-2 bg-slate-800 text-white text-[9px] font-black rounded-lg uppercase">+ Capitulo</button>
                                    <button onClick={()=>setItems([...items, {id:Date.now(), type:'partida', nombre:'Nueva Partida', unidad:'UN', cant:1, precio:0}])} className="px-4 py-2 bg-blue-600 text-white text-[9px] font-black rounded-lg uppercase">+ Partida</button>
                                </div>
                            </div>

                            {/* TOTALES */}
                            <div className="mt-16 flex justify-between border-t-4 border-slate-900 pt-10">
                                <div className="w-1/2 pr-10">
                                    <div className="p-6 bg-slate-50 rounded-3xl border border-slate-100">
                                        <p className="text-[10px] font-black text-slate-400 uppercase mb-2">Términos Comerciales</p>
                                        <p className="text-[10px] text-slate-500 font-bold leading-relaxed uppercase">Válidez: 15 Días • Pago: 50% Anticipo / 50% Entrega • No incluye permisos municipales ni de terceros.</p>
                                    </div>
                                </div>
                                <div className="w-[300px] space-y-3">
                                    <div className="flex justify-between text-[11px] font-bold text-slate-400 uppercase"><span>Costo Directo</span><span>{fmt(totales.directo, 'total')}</span></div>
                                    <div className="flex justify-between text-[11px] font-bold text-slate-400 uppercase"><span>G.G. ({globalGG}%)</span><span>{fmt(totales.gg, 'total')}</span></div>
                                    <div className="flex justify-between text-[11px] font-bold text-slate-400 uppercase"><span>Utilidad ({globalUtil}%)</span><span>{fmt(totales.util, 'total')}</span></div>
                                    <div className="flex justify-between text-lg font-black text-slate-900 pt-4 border-t-2 border-slate-100"><span>NETO</span><span>{fmt(totales.neto, 'total')}</span></div>
                                    <div className="flex justify-between text-[11px] font-bold text-slate-400 italic px-1"><span>IVA (19%)</span><span>{fmt(totales.iva, 'total')}</span></div>
                                    <div className="flex justify-between items-end bg-slate-900 text-white p-6 rounded-3xl mt-6 shadow-2xl shadow-blue-200">
                                        <span className="text-[12px] font-black uppercase italic">Total {config.moneda}</span>
                                        <span className="text-3xl font-black">{fmt(totales.total, 'total')}</span>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-auto pt-20 border-t-2 border-slate-100 text-center">
                                <p className="text-base font-black uppercase text-slate-900 tracking-[0.3em]">{project.profesional}</p>
                                <p className="text-[10px] font-bold text-slate-400 mt-2 uppercase">{project.contacto}</p>
                            </div>
                        </div>
                    </div>

                    {/* MODAL MAESTRO INTEGRADO */}
                    {activeModal === 'main' && (
                        <div className="fixed inset-0 bg-slate-900/90 z-[1000] flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-white w-full max-w-2xl rounded-[3rem] overflow-hidden shadow-2xl flex flex-col">
                                <div className="px-10 pt-10 flex justify-between items-center bg-slate-50 border-b">
                                    <div className="flex gap-10">
                                        <button onClick={()=>setActiveTab('config')} className={`pb-6 text-[10px] uppercase font-black tracking-widest ${activeTab==='config'?'tab-active':'text-slate-400'}`}>General</button>
                                        <button onClick={()=>setActiveTab('apu')} className={`pb-6 text-[10px] uppercase font-black tracking-widest ${activeTab==='apu'?'tab-active':'text-slate-400'}`}>Estudio P.U.</button>
                                        <button onClick={()=>setActiveTab('gg')} className={`pb-6 text-[10px] uppercase font-black tracking-widest ${activeTab==='gg'?'tab-active':'text-slate-400'}`}>Estudio G.G.</button>
                                    </div>
                                    <button onClick={()=>setActiveModal(null)} className="mb-6 bg-slate-200 p-2 rounded-full hover:bg-red-100 transition-colors"><Icons.X /></button>
                                </div>
                                <div className="p-10 max-h-[60vh] overflow-y-auto">
                                    {activeTab === 'config' && <ConfigPanel />}
                                    {activeTab === 'apu' && <APUPanel />}
                                    {activeTab === 'gg' && <GGPanel />}
                                </div>
                                <div className="p-8 bg-slate-50 flex justify-center">
                                    <button onClick={()=>setActiveModal(null)} className="w-full max-w-sm bg-blue-600 text-white py-5 rounded-3xl font-black text-xs uppercase shadow-xl shadow-blue-500/30">Guardar y Regresar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
